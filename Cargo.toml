[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
authors = ["Zeiler contributors"]

[workspace.dependencies]
# shell
tauri = { version = "2.12", features = [] }
tauri-build = "2.7"
tauri-plugin-opener = "2.7"
# Cargo.lock holds its Linux-only rust-ini dep at 0.21.1: 0.21.3 added ParseOption fields
# that deep-link 2.6.2 doesn't set (E0063). Keep it there until deep-link ships a fix.
tauri-plugin-deep-link = "2.6"
tauri-plugin-single-instance = { version = "2.5", features = ["deep-link"] }
tauri-plugin-updater = "2"
# the "Load subtitle file…" picker, opened from Rust only (no JS permission is granted)
tauri-plugin-dialog = "2.8"

# shared
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
thiserror = "2"
anyhow = "1"
url = { version = "2", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
regex = "1"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "native-tls"] }
# "net": the external mpv JSON-IPC backend (Unix sockets / Windows named pipes)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "net"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
# local-profile PINs (Argon2id hashes with a random salt)
argon2 = "0.5"
# the Stremio session key in the OS keychain: macOS Keychain, Windows Credential
# Manager, the Secret Service on Linux (over libdbus, which webkit2gtk already needs)
# wipes the password after a password sign-in (already in Cargo.lock)
zeroize = "1"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
libc = "0.2"
# the watched-episodes bitfield of library items (zeiler-account): zlib + base64, both
# already in Cargo.lock (flate2 via librqbit's compression, base64 via reqwest)
flate2 = "1"
base64 = "0.22"
# subtitle files (zeiler-addon's subfile.rs): BOM and legacy-encoding decoding and
# detection; both already in Cargo.lock
encoding_rs = "0.8"
chardetng = "1"
# XMLTV guides (zeiler-iptv), read as a stream; this version is already in Cargo.lock
quick-xml = "0.42"

# torrent engine — pinned to a main rev carrying Windows fixes #681/#689/#690
# (switch to crates.io once 9.0.2 is released)
# tracing-subscriber-utils is required at this rev: the http-api feature's /stream_logs
# route calls Api::api_log_lines_stream, which only exists with that feature enabled.
librqbit = { git = "https://github.com/ikatson/rqbit", rev = "57e95d16c830863a1fde32d8fa98153b53a3d0b4", default-features = false, features = ["default-tls", "http-api", "tracing-subscriber-utils"] }

# embedded player (behind zeiler-player's `embedded` feature)
libmpv2 = "6.0"
# versions must match what tauri/wry pin, or controller() COM types won't line up
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

# the macOS embedded surface: the versions wry 0.57 already pins in Cargo.lock
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSOpenGL", "NSOpenGLView", "NSResponder", "NSView"] }

# workspace crates
zeiler-account = { path = "crates/zeiler-account" }
zeiler-addon = { path = "crates/zeiler-addon" }
zeiler-engine = { path = "crates/zeiler-engine" }
zeiler-iptv = { path = "crates/zeiler-iptv" }
zeiler-player = { path = "crates/zeiler-player" }
zeiler-skip = { path = "crates/zeiler-skip" }
zeiler-sync = { path = "crates/zeiler-sync" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
