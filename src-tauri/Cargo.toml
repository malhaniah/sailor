[package]
name = "zeiler"
description = "Zeiler — free, open-source desktop client for the Stremio ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# the _lib suffix avoids a bin/lib name clash on Windows
name = "zeiler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
zeiler-account = { workspace = true }
zeiler-addon = { workspace = true }
zeiler-engine = { workspace = true }
zeiler-iptv = { workspace = true }
zeiler-player = { workspace = true }
zeiler-skip = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# DefaultOnError for nested settings groups (subtitles{}, skip{}, …), added in M0 so
# later milestones do not all touch this file and Cargo.lock
serde_with = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# library timestamps (zeiler-account's item times); std only, like the workspace entry
chrono = { workspace = true }
tokio = { workspace = true }
# the addon update check asks six addons at a time (already in Cargo.lock)
futures = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
# subtitle files written to the cache dir get random names; profile ids
uuid = { workspace = true }
# profile PINs are stored as Argon2id hashes (profiles.rs)
argon2 = { workspace = true }
# profile avatars travel as data: URLs
base64 = { workspace = true }
# Stremio account sync (zeiler-sync); its session key lives in the OS keychain
zeiler-sync = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-updater = { workspace = true }
# the subtitle file picker, opened from Rust (no capability lets the webview use it)
tauri-plugin-dialog = { workspace = true }

[target.'cfg(windows)'.dependencies]
# the stremio:// handler saves and restores the scheme's previous owner (deeplink.rs);
# the same version tauri-plugin-deep-link already pulls in
windows-registry = "0.6"
webview2-com = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

# the macOS embedded surface (NSOpenGLView under the WKWebView); the versions wry uses
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }

[features]
# Embedded libmpv playback (video under the transparent webview). On Windows and
# macOS, vendor libmpv first: `node scripts/fetch-libmpv.mjs`. Without this feature
# (or when libmpv-2.dll is missing at runtime) playback falls back to the
# external mpv backend.
embedded = [
    "zeiler-player/embedded",
    "dep:webview2-com",
    "dep:windows",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
]
