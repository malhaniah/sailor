[package]
name = "zeiler"
description = "Zeiler — free, open-source desktop client for the Stremio ecosystem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# the _lib suffix avoids a bin/lib name clash on Windows
name = "zeiler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
zeiler-addon = { workspace = true }
zeiler-engine = { workspace = true }
zeiler-player = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-window-state = { workspace = true }
tauri-plugin-updater = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true, optional = true }
windows = { workspace = true, optional = true }

[features]
# Embedded libmpv playback (video under the transparent webview). On Windows,
# vendor libmpv first: `node scripts/fetch-libmpv.mjs`. Without this feature
# (or when libmpv-2.dll is missing at runtime) playback falls back to the
# external mpv backend.
embedded = ["zeiler-player/embedded", "dep:webview2-com", "dep:windows"]
