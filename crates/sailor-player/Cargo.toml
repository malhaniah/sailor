[package]
name = "sailor-player"
description = "Playback control for Sailor: external mpv backend (embedded libmpv planned)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Embedded libmpv playback (video under a transparent webview). Requires libmpv
# at link time: run `node scripts/fetch-libmpv.mjs` first on Windows.
embedded = ["dep:libmpv2", "dep:serde_json"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
libmpv2 = { workspace = true, optional = true }
