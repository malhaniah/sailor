[package]
name = "zeiler-player"
description = "Playback control for Zeiler: external mpv over JSON IPC, embedded libmpv behind a feature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Embedded libmpv playback (video under a transparent webview). Requires libmpv
# at link time: run `node scripts/fetch-libmpv.mjs` first on Windows.
embedded = ["dep:libmpv2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# random, unguessable IPC endpoint names (named pipes live in a machine-wide namespace)
uuid = { workspace = true }
libmpv2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
# getuid() for the private socket directory
libc = { workspace = true }
