# cargo-deny configuration: license and advisory hygiene for a GPL-3.0-or-later project.
# Run with: cargo deny check

[licenses]
allow = [
  "GPL-3.0",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "Unlicense",
]

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[advisories]
yanked = "warn"

[bans]
multiple-versions = "allow"

[sources]
unknown-git = "deny"
allow-git = ["https://github.com/ikatson/rqbit"]
