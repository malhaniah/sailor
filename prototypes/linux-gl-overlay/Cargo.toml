# M14 prototype (not part of the app): can libmpv's render API draw into a GtkGLArea
# under a transparent WebKitGTK webview, the way the macOS build does with an
# NSOpenGLView under the WKWebView? Same crate versions as the app's Cargo.lock.
[package]
name = "linux-gl-overlay"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
gtk = "=0.18.2"
glib = "=0.18.5"
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
libmpv2 = "=6.0.0"
libc = "0.2"
